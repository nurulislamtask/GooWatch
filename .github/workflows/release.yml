name: Release (Windows installer + Android APK)

# Every time you commit to the main branch (upload / edit files on github.com), this builds
# the Windows installer + the Android APK and puts them on the "Releases" page as version 1.0.<N>.
# Installed GooWatch apps then show an "update available" notification.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: echo "v=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    outputs:
      repo: ${{ steps.rel.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run desktop:prepare
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
      - name: Create the release
        id: rel
        shell: bash
        run: |
          V="v${{ needs.version.outputs.v }}"
          gh release create "$V" --repo "${{ github.repository }}" --title "GooWatch ${{ needs.version.outputs.v }}" --notes "Windows installer (auto-updates) and Android APK." 2>&1 | tee build.log
          echo "repo=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + publish installer (creates the GitHub release v${{ needs.version.outputs.v }})
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish always "-c.extraMetadata.version=${{ needs.version.outputs.v }}" "-c.publish.repo=${{ steps.rel.outputs.repo }}" 2>&1 | tee -a build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Save build log on failure (branch ci-logs)
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --quiet . || true
          tail -n 300 build.log > ../ci.log 2>/dev/null || true
          mv ../ci.log windows-build.log 2>/dev/null || echo "no log" > windows-build.log
          git add windows-build.log
          git commit -q -m "windows build log"
          git push -f origin ci-logs

  android:
    needs: [version, windows]
    if: ${{ needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx vite build
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
      - run: npx cap add android
      - run: pip install pillow && python scripts/android-prepare.py
        env:
          APP_VERSION: ${{ needs.version.outputs.v }}
          APP_VERSION_CODE: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../android-build.log
      - name: Save Android build log on failure (branch ci-logs-android)
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-logs-android
          git rm -rf --quiet . || true
          grep -E "error:|Error|FAILED|What went wrong|warning: \[" -A3 android-build.log | head -150 > android-errors.log || true
          tail -n 80 android-build.log >> android-errors.log || true
          git add android-errors.log
          git commit -q -m "android build log"
          git push -f origin ci-logs-android
      - name: Attach APK to the release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "GooWatch-${{ needs.version.outputs.v }}.apk"
          gh release upload "v${{ needs.version.outputs.v }}" "GooWatch-${{ needs.version.outputs.v }}.apk" --clobber --repo "nurulislamtask/${{ needs.windows.outputs.repo }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
