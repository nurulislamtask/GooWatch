name: Bug report
description: Something does not work (playback, folder scan, posters, update ...)
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      options: [Windows app, Android app, Web]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0.7
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. Screenshots help.
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Source / folder link (if it is about one server)
